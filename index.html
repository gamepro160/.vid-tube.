<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VidTube</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
}

/* HEADER */

header {
    height: 64px;
    background: #0f0f0f;
    border-bottom: 1px solid #272727;

    display: flex;
    align-items: center;

    gap: 20px;
    padding: 0 20px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    background: #ff0033;
    padding: 7px 10px;
    border-radius: 7px;
}

.search {
    display: flex;
    max-width: 700px;
    flex: 1;
    margin: auto;
}

.search input {
    flex: 1;

    background: #121212;
    color: white;

    border: 1px solid #444;
    border-right: none;

    padding: 12px 18px;

    font-size: 16px;

    border-radius: 25px 0 0 25px;

    outline: none;
}

.search button {
    width: 65px;

    border: 1px solid #444;

    background: #272727;
    color: white;

    border-radius: 0 25px 25px 0;

    cursor: pointer;
}

/* SIDEBAR */

.sidebar {
    position: fixed;

    top: 64px;
    bottom: 0;

    width: 220px;

    padding: 18px 10px;

    background: #0f0f0f;
}

.sidebar a {
    display: block;

    color: white;
    text-decoration: none;

    padding: 13px 16px;

    border-radius: 10px;

    margin-bottom: 4px;
}

.sidebar a:hover,
.sidebar a.active {
    background: #272727;
}

/* CONTENT */

.content {
    margin-left: 220px;

    width: calc(100% - 220px);

    padding: 25px;
}

/* CATEGORIES */

.categories {
    display: flex;
    gap: 10px;

    overflow-x: auto;

    margin-bottom: 25px;
}

.categories button {
    border: none;

    background: #272727;
    color: white;

    padding: 9px 16px;

    border-radius: 8px;

    cursor: pointer;

    white-space: nowrap;
}

.categories button:hover {
    background: #444;
}

.categories .selected {
    background: white;
    color: black;
}

/* VIDEOS */

.video-grid {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 30px 18px;
}

.video-card {
    cursor: pointer;
}

.thumbnail {
    width: 100%;

    aspect-ratio: 16 / 9;

    background: #222;

    border-radius: 10px;

    overflow: hidden;

    position: relative;
}

.thumbnail img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    transition: .25s;
}

.video-card:hover img {
    transform: scale(1.05);
}

.duration {
    position: absolute;

    right: 7px;
    bottom: 7px;

    background: rgba(0,0,0,.9);

    padding: 4px 6px;

    border-radius: 4px;

    font-size: 12px;
}

.video-info {
    display: flex;

    gap: 10px;

    padding-top: 10px;
}

.avatar {
    width: 38px;
    height: 38px;

    min-width: 38px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background:
        linear-gradient(
            135deg,
            #ff0033,
            #743cff
        );

    font-weight: bold;
}

.video-title {
    font-size: 15px;

    line-height: 1.35;

    font-weight: bold;
}

.channel {
    color: #aaa;

    font-size: 13px;

    margin-top: 5px;
}

.views {
    color: #888;

    font-size: 13px;

    margin-top: 4px;
}

/* PLAYER */

.player-page {
    display: none;

    position: fixed;

    inset: 0;

    background: #080808;

    z-index: 1000;

    overflow-y: auto;

    padding: 30px;
}

.player-container {
    max-width: 1100px;

    margin: auto;
}

.close {
    background: #272727;

    border: none;

    color: white;

    padding: 10px 15px;

    border-radius: 8px;

    cursor: pointer;

    margin-bottom: 20px;
}

.player {
    width: 100%;

    aspect-ratio: 16 / 9;

    border: none;

    border-radius: 10px;

    background: black;
}

.player-title {
    font-size: 25px;

    font-weight: bold;

    margin-top: 18px;
}

.player-channel {
    color: #aaa;

    margin-top: 10px;
}

/* MOBILE */

@media(max-width:1100px) {

    .video-grid {
        grid-template-columns: repeat(3,1fr);
    }

}

@media(max-width:800px) {

    .sidebar {
        display: none;
    }

    .content {
        margin-left: 0;

        width: 100%;

        padding: 15px;
    }

    .video-grid {
        grid-template-columns: repeat(2,1fr);
    }

    header {
        padding: 0 10px;
    }

    .logo {
        font-size: 18px;
    }

}

@media(max-width:500px) {

    .video-grid {
        grid-template-columns: 1fr;
    }

    .player-page {
        padding: 12px;
    }

}
</style>
</head>

<body>


<header>

    <div class="logo">
        <span>▶</span> VidTube
    </div>

    <div class="search">

        <input
            id="search"
            placeholder="Поиск видео..."
            oninput="searchVideos()"
        >

        <button>
            🔍
        </button>

    </div>

</header>


<aside class="sidebar">

    <a class="active" href="#">
        🏠 Главная
    </a>

    <a href="#">
        🔥 В тренде
    </a>

    <a href="#">
        📺 Подписки
    </a>

    <a href="#">
        🎮 Gaming
    </a>

    <a href="#">
        ⛏️ Minecraft
    </a>

    <a href="#">
        🎵 Музыка
    </a>

    <a href="#">
        😂 Юмор
    </a>

    <a href="#">
        ⚽ Спорт
    </a>

    <a href="#">
        🍪 Cooking
    </a>

</aside>


<main class="content">

    <div class="categories">

        <button class="selected">
            Все
        </button>

        <button>
            Gaming
        </button>

        <button>
            Minecraft
        </button>

        <button>
            Dream
        </button>

        <button>
            MrBeast
        </button>

        <button>
            JudeLow
        </button>

        <button>
            Cookie
        </button>

    </div>


    <div
        class="video-grid"
        id="videos">
    </div>

</main>


<!-- PLAYER -->

<div
    class="player-page"
    id="playerPage"
>

    <div class="player-container">

        <button
            class="close"
            onclick="closePlayer()"
        >
            ← Назад
        </button>


        <iframe
            id="player"
            class="player"
            allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
        </iframe>


        <div
            class="player-title"
            id="playerTitle">
        </div>


        <div
            class="player-channel"
            id="playerChannel">
        </div>

    </div>

</div>


<script>

/*
==================================================
НАСТОЯЩИЕ YOUTUBE ВИДЕО
==================================================

Формат:

{
    title: "Название",
    channel: "Канал",
    id: "YOUTUBE_VIDEO_ID"
}

Например:

https://www.youtube.com/watch?v=lghlkDA1gVY

ID:

lghlkDA1gVY
*/


const youtubeVideos = [

    {
        title:
        "Minecraft, But Everything is Random!",

        channel:
        "MrBeast Gaming",

        id:
        "lghlkDA1gVY"
    },


    {
        title:
        "Minecraft, But Everything is 100x Faster!",

        channel:
        "MrBeast Gaming",

        id:
        "pMVahIsthtc"
    },


    {
        title:
        "Cookie Gets Protected By Minecraft Sniffers",

        channel:
        "CookieClips",

        id:
        "73EE1W1jBO0"
    }

];


/*
==================================================
100 ВИДЕО
==================================================
*/

const names = [

    "Minecraft Challenge",
    "Minecraft Manhunt",
    "100 Players Challenge",
    "Impossible Minecraft",
    "Minecraft Survival",
    "Minecraft Hardcore",
    "Minecraft Speedrun",
    "Minecraft But Everything Changes",
    "Minecraft Lucky Block",
    "Minecraft Hide and Seek",
    "Minecraft Battle",
    "Minecraft Monster Challenge",
    "Minecraft Noob vs Pro",
    "Minecraft Secret Base",
    "Minecraft One Block",
    "Minecraft 100 Days",
    "Minecraft Trap Challenge",
    "Minecraft Escape",
    "Minecraft Tournament",
    "Minecraft Giant Challenge"
];


const channels = [

    "Dream",
    "JudeLow",
    "MrBeast Gaming",
    "Cookie",
    "Minecraft World",
    "Gaming TV",
    "Block World",
    "Game Master",
    "Pro Gaming",
    "Pixel World"

];


let videos = [];


/*
Первые реальные видео
*/

youtubeVideos.forEach(video => {

    videos.push({

        title:
        video.title,

        channel:
        video.channel,

        id:
        video.id,

        real:
        true

    });

});


/*
Добавляем ещё видео,
чтобы всего было 100 карточек.
*/

for (
    let i = videos.length;
    i < 100;
    i++
) {

    const name =
        names[i % names.length];

    const channel =
        channels[i % channels.length];


    videos.push({

        title:
        `${name} #${i + 1}`,

        channel:
        channel,

        id:
        youtubeVideos[
            i % youtubeVideos.length
        ].id,

        real:
        true

    });

}


/*
==================================================
ПОКАЗ ВИДЕО
==================================================
*/

function renderVideos(list) {

    const container =
        document.getElementById("videos");


    container.innerHTML = "";


    list.forEach((video, index) => {

        const card =
            document.createElement("div");


        card.className =
            "video-card";


        /*
        YouTube thumbnail
        */

        const thumbnail =
            `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;


        card.innerHTML = `

            <div class="thumbnail">

                <img
                    src="${thumbnail}"
                    alt="${video.title}"
                >

                <span class="duration">
                    ▶ WATCH
                </span>

            </div>


            <div class="video-info">

                <div class="avatar">

                    ${video.channel.charAt(0)}

                </div>


                <div>

                    <div class="video-title">

                        ${video.title}

                    </div>


                    <div class="channel">

                        ${video.channel}

                    </div>


                    <div class="views">

                        Видео #${index + 1}

                    </div>

                </div>

            </div>

        `;


        /*
        Клик открывает настоящий YouTube-плеер
        */

        card.onclick = function() {

            openPlayer(video);

        };


        container.appendChild(card);

    });

}


/*
==================================================
ОТКРЫТЬ ПЛЕЕР
==================================================
*/

function openPlayer(video) {

    const page =
        document.getElementById("playerPage");


    const player =
        document.getElementById("player");


    const title =
        document.getElementById("playerTitle");


    const channel =
        document.getElementById("playerChannel");


    /*
    Встраиваем YouTube
    */

    player.src =
        `https://www.youtube.com/embed/${video.id}?autoplay=1`;


    title.textContent =
        video.title;


    channel.textContent =
        "Канал: " + video.channel;


    page.style.display =
        "block";


    document.body.style.overflow =
        "hidden";

}


/*
==================================================
ЗАКРЫТЬ ПЛЕЕР
==================================================
*/

function closePlayer() {

    const page =
        document.getElementById("playerPage");


    const player =
        document.getElementById("player");


    /*
    Останавливаем видео
    */

    player.src = "";


    page.style.display =
        "none";


    document.body.style.overflow =
        "auto";

}


/*
==================================================
ПОИСК
==================================================
*/

function searchVideos() {

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const result =
        videos.filter(video =>

            video.title
            .toLowerCase()
            .includes(query)

            ||

            video.channel
            .toLowerCase()
            .includes(query)

        );


    renderVideos(result);

}


/*
==================================================
ЗАПУСК
==================================================
*/

renderVideos(videos);

</script>

</body>
</html>
